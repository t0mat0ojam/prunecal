[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "prunecal"
version = "0.1.0"
description = "Prune, probe, recalibrate: a calibration-free compression pipeline for EEG decoders and other BatchNorm CNNs."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Tomoharu Hayakawa" }]
keywords = ["EEG", "BCI", "pruning", "test-time adaptation", "batch normalization", "tinyml"]
dependencies = [
    "torch>=2.0",
    "torch-pruning>=1.3",
    "numpy",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
